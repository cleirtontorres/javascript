<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sua Nacionalidade</title>
</head>

<body>
    <h1>Qual sua nacionalidade?</h1>
    <input type="text" name="pais" id="pais">
    <input type="button" value="verificar" onclick="verificar()">
    <div id="res">

    </div>

    <script>
        function verificar() {
            let pais = document.querySelector('#pais').value
            let res = document.querySelector('#res')
            res.innerHTML = `Seu país é: ${pais}`
            if (pais.toLowerCase() == 'brasil') {
                res.innerHTML += `<p>Voçê é brasileiro</p>`
            } else {
                res.innerHTML += `<p>Voçê é estrangeiro</p>`
            }

        }
    </script>
</body>

</html>
