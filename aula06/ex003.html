<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro javascript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Ola, Mundo!</h1>
    <p>Já sei usar javascript!</p>

    <script>
        var n1 = Number.parseInt(window.prompt('Digite um numero:'))
        var n2 = Number.parseInt(window.prompt('Digite outro numero:'))
        var resultado = n1 + n2
        alert(`O resultado da soma de ${n1} e ${n2} é igual a: ${resultado}`)
    </script>
</body>
</html>
